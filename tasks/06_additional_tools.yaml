---
- name: Install additional tools
  hosts: webservers
  remote_user: root
  vars_files:
    - ../vars/additional_tools.yaml
  tasks:
  - name: ImageMagick, PngQuant, OptiPng, WebP
    apt:
      pkg:
        - imagemagick
        - pngquant
        - optipng
        - webp
      state: present
      update_cache: yes
  - name: JPEGOptim
    get_url:
      url: https://github.com/imagemin/jpegoptim-bin/raw/main/vendor/linux/jpegoptim
      dest: "{{ additional_tools_binaries_folder }}/jpegoptim"
      mode: 0755
      timeout: 60
